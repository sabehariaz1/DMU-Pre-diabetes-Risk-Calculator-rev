name: Save Risk Calculator Scores

on:
  repository_dispatch:
    types: [log_risk_score]

jobs:
  append_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RESEARCH_DATA_PAT }}

      - name: Append data to CSV
        run: |
          if [ ! -f research_data.csv ]; then
            echo "Timestamp,Score,RiskCategory,Age,BMI,BMICategory,FamilyHistory,Activity,WaistSize,DietControl" > research_data.csv
          fi
          
          TIMESTAMP="${{ github.event.client_payload.timestamp }}"
          SCORE="${{ github.event.client_payload.score }}"
          CATEGORY="${{ github.event.client_payload.riskCategory }}"
          AGE="${{ github.event.client_payload.age }}"
          BMI="${{ github.event.client_payload.bmi }}"
          BMI_CAT="${{ github.event.client_payload.bmi_category }}"
          FAMILY="${{ github.event.client_payload.family }}"
          ACTIVITY="${{ github.event.client_payload.activity }}"
          WAIST="${{ github.event.client_payload.waist }}"
          DIET="${{ github.event.client_payload.diet }}"
          
          echo "\"$TIMESTAMP\",\"$SCORE\",\"$CATEGORY\",\"$AGE\",\"$BMI\",\"$BMI_CAT\",\"$FAMILY\",\"$ACTIVITY\",\"$WAIST\",\"$DIET\"" >> research_data.csv

      - name: Commit and Push update to GitHub
        run: |
          git config --global user.name "Data Log Bot"
          git config --global user.email "actions@github.com"
          git add research_data.csv
          git commit -m "Automated log: Added participant research entry"
          git push
