<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prediabetes Risk Calculator</title>
<meta name="description" content="A free educational screening tool to spread community awareness about prediabetes risk. Not a medical diagnosis." />

<!-- ============================================================
     FONTS: Lora (headings) + Inter (body/UI) via Google Fonts
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ============================================================
     TAILWIND CSS via CDN
     ============================================================ -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'dmu-navy':      '#0B2447',
          'dmu-navy-deep': '#061530',
          'dmu-gold':      '#C6A15B',
          'dmu-gold-dark': '#A9843F',
          'dmu-paper':     '#F7F8FA',
          'dmu-ink':       '#1B2430',
          'risk-high':     '#A3311E',
          'risk-high-bg':  '#FBEAE7',
          'risk-ok':       '#1E5631',
          'risk-ok-bg':    '#EAF3EC',
        },
        fontFamily: {
          serif: ['Lora', 'ui-serif', 'Georgia', 'serif'],
          sans:  ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
      }
    }
  }
</script>

<style>
  body {
    background-color: #F7F8FA;
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    color: #1B2430;
  }

  h1, h2, h3, .font-serif-heading {
    font-family: 'Lora', ui-serif, Georgia, serif;
  }

  #progress-fill {
    transition: width 300ms ease;
  }

  .step-panel {
    animation: fadeSlideIn 380ms ease both;
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .step-panel { animation: none; }
  }

  .dmu-focusable:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(198, 161, 91, 0.55);
  }
